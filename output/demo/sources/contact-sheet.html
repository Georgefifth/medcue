<!doctype html><html lang="en"><meta charset="utf-8"><title>MedCue visual narrative</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f3;font-family:DejaVu Sans,sans-serif;color:#143343}.slide{width:1920px;height:1080px;padding:40px 50px}h1{font-size:42px;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}figure{margin:0}img{width:100%;aspect-ratio:16/9;display:block}figcaption{font-size:20px;padding:10px 0;color:#516c77}</style><main class="slide" id="contact"><h1>MedCue visual narrative</h1><div class="grid" id="grid"></div></main><script>const slides=[['01-problem','A real transcription difference'],['02-workflow','The review workflow'],['03-listen-focus','Guided attention'],['04-workspace','Annotated product evidence'],['05-local-architecture','The browser boundary'],['06-ai-architecture','Optional inference'],['07-output','The actual export structure'],['08-evidence','Bounded verification'],['09-ai-limits','A useful lead and a misplaced warning'],['10-try','A working public destination']];for(const[id,label]of slides){const f=document.createElement('figure');const a=document.createElement('a');a.href='../assets/'+id+'.png';const i=document.createElement('img');i.src=a.href;const c=document.createElement('figcaption');c.textContent=label;a.append(i);f.append(a,c);document.getElementById('grid').append(f)}</script></html>
